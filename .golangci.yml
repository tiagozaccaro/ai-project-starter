# golangci-lint configuration
# Enforces gofmt, go vet, ineffassign (T004)
run:
  timeout: 5m

linters:
  enable:
    - gofmt
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable-all: true

linters-settings:
  gofmt:
    simplify: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - govet
